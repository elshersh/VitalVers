# Builds the Vitalverse container image on every push to main and publishes it to GitHub Container Registry
# as a public package (free for public repositories). Any Docker host can run it:
#   docker run -p 7860:7860 ghcr.io/elshersh/vitalvers:latest
# The online chatbot needs GEMINI_API_KEY set in the host's secret settings (scripts/render_start.py).
name: Container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vitalvers:latest
            ghcr.io/${{ github.repository_owner }}/vitalvers:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Vitalverse astronaut health monitoring prototype (research/education only, not for clinical diagnosis)
          cache-from: type=gha
          cache-to: type=gha,mode=max
