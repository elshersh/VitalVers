# Builds the Vitalverse container image on every push to main and publishes it to GitHub Container Registry
# (ghcr.io/elshersh/vitalvers). The always-on site on Azure App Service runs this image.
# If the repository secret AZURE_WEBAPP_WEBHOOK is set (Azure portal > the web app > Deployment Center >
# Webhook URL), Azure is told to pull the new image right away; otherwise restart the web app to update it.
name: Container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURE_WEBAPP_WEBHOOK: ${{ secrets.AZURE_WEBAPP_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vitalvers:latest
            ghcr.io/${{ github.repository_owner }}/vitalvers:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Vitalverse astronaut health monitoring prototype (research/education only, not for clinical diagnosis)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tell Azure to pull the new image
        if: env.AZURE_WEBAPP_WEBHOOK != ''
        run: curl -fsS -X POST -d '' -o /dev/null "$AZURE_WEBAPP_WEBHOOK"
